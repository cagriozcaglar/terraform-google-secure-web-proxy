apiVersion: blueprints.cloud.google.com/v1alpha1
kind: TerraformBlueprint
metadata:
  # A machine-readable name for the blueprint.
  name: terraform-google-secure-web-proxy
  # Details about the source repository.
  source:
    type: git
    git:
      repo: https://github.com/GoogleCloudPlatform/terraform-google-secure-web-proxy.git
      dir: /
  # The current release version of the blueprint.
  version: 1.0.0
spec:
  # actuationTool defines the tool used to apply the blueprint.
  terraformSpec:
    actuationTool:
      type: Terraform
      # Compatible Terraform client versions.
      versions:
        - ">= 1.3.0"
  # info provides general information about the blueprint.
  info:
    # A human-readable title for the blueprint.
    title: Secure Web Proxy Gateway
    # A short, one-sentence description.
    tagline: Deploys a Google Cloud Secure Web Proxy instance with a security policy.
    # labels for organizing and searching for the blueprint.
    labels:
      service: secure-web-proxy
      platform: gcp
    # A more detailed description of the blueprint's purpose and functionality.
    descriptions:
      detailed: |
        This blueprint deploys a Google Cloud Secure Web Proxy (SWP) Gateway, an associated Gateway Security Policy, and a set of security rules.
        SWP provides a secure outbound web gateway that allows you to enforce granular access policies for egress traffic, log network transactions, and prevent data exfiltration.
        This module configures the core components needed for a functional SWP instance in a specified VPC network and proxy-only subnet.
    # Links to official documentation.
    documentations:
      - title: Secure Web Proxy Overview
        url: https://cloud.google.com/secure-web-proxy/docs/overview
  # content includes examples, diagrams, etc.
  content:
    # A list of examples for using the blueprint.
    examples:
      - name: simple_gateway
        location: examples/simple_gateway
        title: Simple SWP Gateway
        description: A basic example of deploying a Secure Web Proxy gateway with a default allow rule.
    # A list of visualization diagrams.
    diagrams:
      - name: architecture.svg
        description: A diagram illustrating the architecture of the Secure Web Proxy gateway within a VPC.
  # interface defines the user-facing inputs and outputs of the blueprint.
  interface:
    # Lists input variables for the blueprint.
    variables:
      - name: name
        description: The base name for the Secure Web Proxy gateway and its associated security policy.
        type: string
        required: true
      - name: network
        description: The self-link of the VPC network to which the Secure Web Proxy is attached. E.g., 'projects/my-project/global/networks/my-network'.
        type: string
        required: true
      - name: subnet
        description: The self-link of the proxy-only subnet to which the Secure Web Proxy is attached. E.g., 'projects/my-project/regions/us-central1/subnetworks/my-proxy-subnet'.
        type: string
        required: true
      - name: project_id
        description: The project ID where the Secure Web Proxy and its components will be deployed. If not provided, the provider project is used.
        type: string
        required: false
        default: null
      - name: location
        description: The Google Cloud region where the Secure Web Proxy will be deployed. If not provided, the provider's region is used.
        type: string
        required: false
        default: null
      - name: ports
        description: A list of ports to which the gateway is bound. The gateway will listen on these ports for incoming traffic.
        type: list(number)
        required: false
        default:
          - 443
      - name: rules
        description: A list of security policy rules to apply. Rules are evaluated by priority (lowest number first). The 'name' of each rule must be unique. The 'basic_profile' must be either 'ALLOW' or 'DENY'.
        type: list
        required: false
        default:
          - name: "allow-all-default"
            description: "Default rule to allow all traffic."
            enabled: true
            priority: 1000
            session_matcher: "true"
            application_matcher: null
            basic_profile: "ALLOW"
      - name: tls_inspection_policy
        description: The self-link of an existing TLS Inspection Policy to be attached to the security policy for inspecting encrypted traffic. If set to null, TLS inspection is disabled.
        type: string
        required: false
        default: null
    # Groups of related variables.
    variableGroups:
      - name: Gateway Configuration
        description: Core settings for the Secure Web Proxy gateway.
        variables:
          - name
          - project_id
          - location
          - network
          - subnet
          - ports
      - name: Security Policy Configuration
        description: Settings for the associated security policy and rules.
        variables:
          - rules
          - tls_inspection_policy
    # lists the outputs of the blueprint.
    outputs:
      - name: gateway_id
        description: The fully qualified ID of the created Secure Web Proxy gateway.
      - name: gateway_name
        description: The name of the created Secure Web Proxy gateway.
      - name: policy_id
        description: The fully qualified ID of the associated Secure Web Proxy security policy.
      - name: policy_name
        description: The name of the associated Secure Web Proxy security policy.
  # requirements defines prerequisites for deploying the blueprint.
  requirements:
    # GCP IAM roles required for the service account to deploy the blueprint.
    roles:
      - level: project
        roles:
          - roles/networkservices.admin
          - roles/networksecurity.admin
          - roles/compute.networkUser
    # GCP APIs that need to be enabled.
    services:
      - networkservices.googleapis.com
      - networksecurity.googleapis.com
      - compute.googleapis.com
